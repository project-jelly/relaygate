name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.repository.default_branch }}
  queue: max

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  changes:
    name: Detect component releases
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Detect unpublished component versions
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          needs_release() {
            local component="$1"
            local version_file="$2"
            local version tag existing_commit release_status

            version=$(tr -d '[:space:]' < "$version_file")
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "::error::${version_file} must contain a Docker-compatible semantic version" >&2
              return 1
            fi
            tag="${component}-v${version}"

            if ! git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              echo true
              return
            fi

            if ! release_status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag"); then
              echo "::error::failed to query release $tag" >&2
              return 1
            fi
            case "$release_status" in
              200)
                echo false
                return
                ;;
              404) ;;
              *)
                echo "::error::release lookup for $tag returned HTTP $release_status" >&2
                return 1
                ;;
            esac

            existing_commit=$(git rev-list -n 1 "$tag")
            if [ "$existing_commit" = "$RELEASE_SHA" ]; then
              echo true
              return
            fi

            echo "::error::tag $tag exists at $existing_commit without a release; rerun its original release or bump $version_file" >&2
            return 1
          }

          gateway=$(needs_release gateway VERSION.gateway)
          route_table=$(needs_release route-table VERSION.route-table)

          python3 - "$gateway" "$route_table" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          include = []
          if sys.argv[1] == "true":
              include.append({
                  "component": "gateway",
                  "version_file": "VERSION.gateway",
                  "image": "relaygate-gateway",
                  "target": "gateway",
              })
          if sys.argv[2] == "true":
              include.append({
                  "component": "route-table",
                  "version_file": "VERSION.route-table",
                  "image": "relaygate-route-table",
                  "target": "route-table",
              })
          print(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}")
          PY

  release:
    name: Release ${{ matrix.component }}
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '{"include":[]}' }}
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(tr -d '[:space:]' < "${{ matrix.version_file }}")
          if [ -z "$version" ]; then
            echo "::error::${{ matrix.version_file }} is empty"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::${{ matrix.version_file }} must contain a Docker-compatible semantic version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.component }}-v$version" >> "$GITHUB_OUTPUT"

          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}"
          current_version=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/contents/${{ matrix.version_file }}?ref=${{ github.event.repository.default_branch }}" \
              --jq .content \
              | base64 --decode \
              | tr -d '[:space:]'
          )
          {
            echo 'image_tags<<EOF'
            echo "${image}:${version}"
            if [ "$version" = "$current_version" ]; then
              echo "${image}:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Validate existing tag
        id: existing
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if ! git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_commit=$(git rev-list -n 1 "$tag")
          if [ "$existing_commit" != "$RELEASE_SHA" ]; then
            echo "::error::tag $tag already points to $existing_commit; bump ${{ matrix.version_file }} before merging"
            exit 1
          fi

          echo "tag_exists=true" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=Apache-2.0
          tags: ${{ steps.ver.outputs.image_tags }}

      - name: Create component GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          previous_tag=$(
            git tag --list '${{ matrix.component }}-v*' --sort=-version:refname \
              | grep -vxF "$tag" \
              | head -n 1 \
              || true
          )
          args=(
            "$tag"
            --title "${{ matrix.component }} v${{ steps.ver.outputs.version }}"
            --generate-notes
            --latest=false
          )
          if [ "${{ steps.existing.outputs.tag_exists }}" = "true" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$RELEASE_SHA")
          fi
          if [ -n "$previous_tag" ]; then
            args+=(--notes-start-tag "$previous_tag")
          fi
          gh release create "${args[@]}"

      - name: Keep recent 20 release images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.image }}
        run: |
          owner_type=$(gh api "/repos/${GITHUB_REPOSITORY}" --jq .owner.type)
          case "$owner_type" in
            User) package_scope=users ;;
            Organization) package_scope=orgs ;;
            *) echo "::error::unsupported repository owner type: ${owner_type}"; exit 1 ;;
          esac
          package_api="/${package_scope}/${OWNER}/packages/container/${PACKAGE}"

          version_output=$(
            gh api --paginate \
              "${package_api}/versions?per_page=100" \
              --jq '.[]
                | select(any(.metadata.container.tags[]?;
                    test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$")))
                | [.created_at, (.id | tostring)]
                | @tsv' \
              | sort -r \
              | cut -f2
          )
          version_ids=()
          if [ -n "$version_output" ]; then
            mapfile -t version_ids <<< "$version_output"
          fi

          versions_to_keep=20
          if (( ${#version_ids[@]} <= versions_to_keep )); then
            exit 0
          fi

          for version_id in "${version_ids[@]:versions_to_keep}"; do
            gh api --method DELETE \
              "${package_api}/versions/${version_id}"
          done
