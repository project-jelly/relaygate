name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHART_REPOSITORY: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: 1.96.1
  SHELLCHECK_VERSION: v0.10.0
  SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: scope
        # `shell: bash` enables pipefail, so a script failure fails this step
        # instead of leaving the outputs empty and silently skipping jobs.
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/change_scope.py --base "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Install pinned shellcheck
        run: |
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Lint acceptance shell scripts
        run: |
          for script in tests/kind/run.sh tests/kind/certificates.sh; do
            bash -n "$script"
          done
          shellcheck -x tests/kind/run.sh tests/kind/certificates.sh

      - name: Check Helm release policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 .github/scripts/helm_release.py check-version --base "$BASE_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Whitespace check
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

      - name: Validate local observability assets
        run: |
          docker compose --profile observability config --quiet
          for dashboard in monitoring/grafana/dashboards/*.json; do
            python3 -m json.tool "$dashboard" >/dev/null
          done

      - name: Verify dashboard query semantics
        run: |
          export PROMTOOL="docker run --rm --volume $PWD:$PWD --workdir $PWD --entrypoint promtool prom/prometheus:v3.13.1"
          python3 .github/scripts/test_observability.py -v

      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          rhysd/actionlint:1.7.12
          -color
          -ignore 'unexpected key "queue"'

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.15.2

      - name: Validate Helm chart
        run: |
          python3 .github/scripts/helm_transport_test.py -v
          mkdir -p target/helm
          helm lint --strict deploy/helm/relaygate \
            --kube-version 1.32.0
          helm template relaygate deploy/helm/relaygate \
            --namespace relaygate \
            --kube-version 1.32.0 \
            --set gateway.replicaCount=3 --set routeTable.shardCount=2 \
            > target/helm/default.yaml
          helm template minimal deploy/helm/relaygate \
            --namespace relaygate-test \
            --kube-version 1.32.0 \
            --set gateway.replicaCount=1 \
            --set routeTable.shardCount=1 \
            --set metrics.enabled=false \
            --set authorization.existingConfigMap=minimal-authorization \
            > target/helm/minimal.yaml
          helm template load-balancer deploy/helm/relaygate \
            --namespace relaygate-test \
            --kube-version 1.32.0 \
            --set gateway.service.type=LoadBalancer \
            --set-string gateway.service.loadBalancerClass=example.io/l4 \
            --set gateway.service.externalTrafficPolicy=Local \
            > target/helm/load-balancer.yaml
          helm template webpki deploy/helm/relaygate \
            --namespace relaygate-test \
            --kube-version 1.32.0 \
            --set tls.edge.trustMode=webPkiRoots \
            > target/helm/webpki.yaml
          helm template true deploy/helm/relaygate \
            --namespace relaygate-test \
            --kube-version 1.32.0 \
            --set-string serviceAccount.name=true \
            > target/helm/ambiguous-name.yaml

          render_pod_template() {
            chart="$1"
            template="$2"
            output="$3"
            shift 3
            helm template rollout-isolation "$chart" \
              --namespace relaygate-test \
              --kube-version 1.32.0 \
              --show-only "templates/${template}-statefulset.yaml" \
              "$@" |
              awk '/^  template:$/ { found = 1 } found' > "$output"
            test -s "$output"
          }

          render_pod_template deploy/helm/relaygate gateway \
            target/helm/rollout-base-gateway.yaml
          render_pod_template deploy/helm/relaygate route-table \
            target/helm/rollout-base-route-table.yaml

          cp -R deploy/helm/relaygate target/helm/chart-version-only
          sed 's/^version: .*/version: 99.99.99/' \
            target/helm/chart-version-only/Chart.yaml \
            > target/helm/chart-version-only/Chart.yaml.new
          mv target/helm/chart-version-only/Chart.yaml.new \
            target/helm/chart-version-only/Chart.yaml
          render_pod_template target/helm/chart-version-only gateway \
            target/helm/rollout-chart-version-gateway.yaml
          render_pod_template target/helm/chart-version-only route-table \
            target/helm/rollout-chart-version-route-table.yaml
          cmp -s target/helm/rollout-base-gateway.yaml \
            target/helm/rollout-chart-version-gateway.yaml
          cmp -s target/helm/rollout-base-route-table.yaml \
            target/helm/rollout-chart-version-route-table.yaml

          render_pod_template deploy/helm/relaygate gateway \
            target/helm/rollout-gateway-image-gateway.yaml \
            --set-string gateway.image.tag=rollout-sentinel
          render_pod_template deploy/helm/relaygate route-table \
            target/helm/rollout-gateway-image-route-table.yaml \
            --set-string gateway.image.tag=rollout-sentinel
          if cmp -s target/helm/rollout-base-gateway.yaml \
            target/helm/rollout-gateway-image-gateway.yaml; then
            echo "Gateway image change did not change the Gateway Pod template"
            exit 1
          fi
          cmp -s target/helm/rollout-base-route-table.yaml \
            target/helm/rollout-gateway-image-route-table.yaml

          render_pod_template deploy/helm/relaygate gateway \
            target/helm/rollout-route-table-image-gateway.yaml \
            --set-string routeTable.image.tag=rollout-sentinel
          render_pod_template deploy/helm/relaygate route-table \
            target/helm/rollout-route-table-image-route-table.yaml \
            --set-string routeTable.image.tag=rollout-sentinel
          cmp -s target/helm/rollout-base-gateway.yaml \
            target/helm/rollout-route-table-image-gateway.yaml
          if cmp -s target/helm/rollout-base-route-table.yaml \
            target/helm/rollout-route-table-image-route-table.yaml; then
            echo "RouteTable image change did not change the RouteTable Pod template"
            exit 1
          fi

          long_release_prefix=$(printf 'a%.0s' {1..44})
          for suffix in one two; do
            helm template "${long_release_prefix}-${suffix}" deploy/helm/relaygate \
              --namespace relaygate-test \
              --kube-version 1.32.0 \
              --show-only templates/shard-directory-configmap.yaml \
              > "target/helm/long-name-${suffix}.yaml"
          done
          for release_name in foo foo-relaygate; do
            helm template "$release_name" deploy/helm/relaygate \
              --namespace relaygate-test \
              --kube-version 1.32.0 \
              --show-only templates/shard-directory-configmap.yaml \
              > "target/helm/release-name-${release_name}.yaml"
          done

          test "$(grep -c '^kind: StatefulSet$' target/helm/default.yaml)" -eq 2
          deployment_count=$(grep -c '^kind: Deployment$' target/helm/default.yaml || true)
          test "$deployment_count" -eq 0
          test "$(grep -c '^kind: Service$' target/helm/default.yaml)" -eq 3
          test "$(grep -c '^  type: ClusterIP$' target/helm/default.yaml)" -eq 3
          test "$(grep -c '^  clusterIP: None$' target/helm/default.yaml)" -eq 2
          test "$(grep -c '^  replicas: 3$' target/helm/default.yaml)" -eq 1
          test "$(grep -c '^  replicas: 2$' target/helm/default.yaml)" -eq 1
          test "$(grep -c '^    type: RollingUpdate$' target/helm/default.yaml)" -eq 2
          test "$(grep -c '^kind: StatefulSet$' target/helm/minimal.yaml)" -eq 2
          test "$(grep -c '^  replicas: 1$' target/helm/minimal.yaml)" -eq 2
          grep -A1 -Fq 'name: RELAYGATE_GATEWAY_NAME' target/helm/default.yaml
          grep -Fq "value: \"\$(POD_NAME)\"" target/helm/default.yaml
          grep -Fq "value: \"\$(POD_NAME).relaygate-gateway-peer.\$(POD_NAMESPACE).svc.cluster.local:27421\"" \
            target/helm/default.yaml
          grep -Fq "fieldPath: \"metadata.labels['apps.kubernetes.io/pod-index']\"" \
            target/helm/default.yaml
          grep -Fq "value: \"rt-\$(POD_INDEX)\"" target/helm/default.yaml
          grep -Fq '"id":"rt-0"' target/helm/default.yaml
          grep -Fq '"id":"rt-1"' target/helm/default.yaml
          grep -Fq '"format_version":2' target/helm/default.yaml
          grep -Fq '"authority_hash":"sha256-destination-modulo-v2"' target/helm/default.yaml
          grep -Fq 'relaygate-rt-0.relaygate-rt.relaygate.svc.cluster.local:27430' target/helm/default.yaml
          grep -Fq 'relaygate-rt-1.relaygate-rt.relaygate.svc.cluster.local:27430' target/helm/default.yaml
          grep -Fq 'immutable: true' target/helm/default.yaml
          test "$(grep 'checksum/shard-directory:' target/helm/default.yaml | sort -u | wc -l)" -eq 1
          directory_json=$(awk '/^  shard-directory.json: \|-$/ { getline; sub(/^    /, ""); print; exit }' target/helm/default.yaml)
          directory_checksum=$(printf '%s' "$directory_json" | sha256sum | cut -d ' ' -f1)
          rendered_checksum=$(grep 'checksum/shard-directory:' target/helm/default.yaml | head -n1 | tr -d '"' | awk '{print $2}')
          test "$directory_checksum" = "$rendered_checksum"
          if grep -Fq 'RELAYGATE_INTERNAL_GATEWAY_KEYS' target/helm/default.yaml; then
            echo "Helm chart still rendered removed internal credentials"
            exit 1
          fi
          grep -Fq 'name: RELAYGATE_AUTH_CONFIG_PATH' target/helm/default.yaml
          grep -Fq 'name: "relaygate-authorization"' target/helm/default.yaml
          grep -Fq 'key: "authorization.json"' target/helm/default.yaml
          if grep -Eq 'cluster-token|next-cluster-token|RELAYGATE_CLUSTER_TOKEN' target/helm/default.yaml; then
            echo "Helm chart still rendered removed session credentials"
            exit 1
          fi
          if grep -Eq 'relaygate.io/.*-reload:|reloader.stakater.com/' target/helm/default.yaml; then
            echo "Helm defaults contain platform restart policy"
            exit 1
          fi
          test "$(grep -c '^              mountPath: /etc/relaygate$' target/helm/default.yaml)" -eq 2
          test "$(grep -c '^              mountPath: /etc/relaygate/tls/edge$' target/helm/default.yaml)" -eq 1
          test "$(grep -c '^              mountPath: /etc/relaygate/tls/internal$' target/helm/default.yaml)" -eq 2
          grep -Fq 'name: RELAYGATE_SDK_TLS_CERT_PATH' target/helm/default.yaml
          grep -Fq 'name: RELAYGATE_SDK_TLS_CA_PATH' target/helm/default.yaml
          if grep -Fq 'name: RELAYGATE_SDK_TLS_CA_PATH' target/helm/webpki.yaml; then
            echo "Helm chart mounted a custom edge CA in public Web PKI mode"
            exit 1
          fi
          test "$(grep -c 'key: ca.crt' target/helm/default.yaml)" -eq 3
          test "$(grep -c 'key: ca.crt' target/helm/webpki.yaml)" -eq 2
          grep -Fq 'name: RELAYGATE_INTERNAL_TLS_CA_PATH' target/helm/default.yaml
          grep -Fq 'name: RELAYGATE_PEER_TLS_SERVER_NAME' target/helm/default.yaml
          grep -Fq 'name: RELAYGATE_RT_TLS_SERVER_NAME' target/helm/default.yaml
          test "$(grep -c 'key: tls.crt' target/helm/default.yaml)" -eq 3
          test "$(grep -c 'secretName: "relaygate-edge-tls"' target/helm/default.yaml)" -eq 1
          test "$(grep -c 'name: "relaygate-internal-trust"' target/helm/default.yaml)" -eq 2
          grep -Fq 'name: "relaygate-gw-internal-tls"' target/helm/default.yaml
          grep -Fq 'name: "relaygate-rt-internal-tls"' target/helm/default.yaml
          if grep -Eq '^kind: (Certificate|Issuer|ClusterIssuer|Secret)$' target/helm/default.yaml; then
            echo "Helm chart rendered platform credential/certificate resources"
            exit 1
          fi
          grep -Fq 'type: LoadBalancer' target/helm/load-balancer.yaml
          grep -Fq 'loadBalancerClass: "example.io/l4"' target/helm/load-balancer.yaml
          grep -Fq 'externalTrafficPolicy: Local' target/helm/load-balancer.yaml
          if grep -Eq 'RELAYGATE_(INSECURE_TEST_TRANSPORT|RT_TRUSTED_LOCAL|CLIENT_KEYS)' target/helm/default.yaml; then
            echo "Helm chart rendered a test-only or removed security switch"
            exit 1
          fi
          test "$(grep -c '^[[:space:]]*runAsNonRoot: true$' target/helm/default.yaml)" -eq 2
          test "$(grep -c '^[[:space:]]*readOnlyRootFilesystem: true$' target/helm/default.yaml)" -eq 2
          test "$(grep -c '^[[:space:]]*- name: metrics$' target/helm/default.yaml)" -eq 4
          test "$(grep -c '^[[:space:]]*prometheus.io/scrape: \"true\"$' target/helm/default.yaml)" -eq 2
          grep -Fq 'value: "0.0.0.0:27422"' target/helm/default.yaml
          grep -Fq 'value: "0.0.0.0:27431"' target/helm/default.yaml
          grep -A1 -Fq 'name: RELAYGATE_DRAIN_TIMEOUT_MS' target/helm/default.yaml
          grep -Fq 'value: "120000"' target/helm/default.yaml
          grep -Fq 'terminationGracePeriodSeconds: 135' target/helm/default.yaml
          if grep -Fq 'RELAYGATE_METRICS_BIND_ADDR' target/helm/minimal.yaml; then
            echo "Helm chart rendered metrics while metrics.enabled=false"
            exit 1
          fi
          long_name_one=$(awk '/^  name:/ { print $2; exit }' target/helm/long-name-one.yaml)
          long_name_two=$(awk '/^  name:/ { print $2; exit }' target/helm/long-name-two.yaml)
          test "$long_name_one" != "$long_name_two"
          test "${#long_name_one}" -le 63
          test "${#long_name_two}" -le 63
          release_name_foo=$(awk '/^  name:/ { print $2; exit }' target/helm/release-name-foo.yaml)
          release_name_with_chart=$(awk '/^  name:/ { print $2; exit }' target/helm/release-name-foo-relaygate.yaml)
          test "$release_name_foo" != "$release_name_with_chart"
          if grep -Eq '^kind: (Deployment|Secret|PersistentVolumeClaim|Ingress|HorizontalPodAutoscaler)$|^[[:space:]]+(emptyDir|volumeClaimTemplates):' \
            target/helm/default.yaml; then
            echo "Helm chart rendered a forbidden stateful or application-owned resource"
            exit 1
          fi
          if grep -Eq '^  type: (NodePort|LoadBalancer)$|^[[:space:]]+nodePort:' \
            target/helm/default.yaml; then
            echo "Helm chart exposed a public Service"
            exit 1
          fi

          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.31.0 >/dev/null 2>&1; then
            echo "Helm chart accepted Kubernetes older than 1.32"
            exit 1
          fi

          for invalid_release_name in 1relay foo.bar; do
            if helm template "$invalid_release_name" deploy/helm/relaygate \
              --kube-version 1.32.0 >/dev/null 2>&1; then
              echo "Helm chart accepted a release name that is not an RFC 1035 label"
              exit 1
            fi
          done

          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set routeTable.shardCount=0 >/dev/null 2>&1; then
            echo "Helm schema accepted an empty RouteTable directory"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set routeTable.shardCount=2049 >/dev/null 2>&1; then
            echo "Helm schema accepted a RouteTable directory larger than the ConfigMap-safe bound"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set tls.edge.trustMode=unknown >/dev/null 2>&1; then
            echo "Helm schema accepted an unknown edge TLS trust mode"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set tls.internal.source=unknown >/dev/null 2>&1; then
            echo "Helm schema accepted removed internal TLS source"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set tls.internal.source=certManager >/dev/null 2>&1; then
            echo "Helm chart accepted removed cert-manager configuration"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set 'gateway.extraEnv[0].name=RELAYGATE_BIND_ADDR' \
            --set 'gateway.extraEnv[0].value=invalid' >/dev/null 2>&1; then
            echo "Helm chart accepted an override of a managed environment variable"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set-string 'gateway.image.repository=registry/repo"' >/dev/null 2>&1; then
            echo "Helm schema accepted an unsafe image repository"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set-string 'gateway.image.repository=registry.example/relaygate:' >/dev/null 2>&1; then
            echo "Helm chart accepted an image repository ending in a tag separator"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set-string 'gateway.image.repository=registry.example/team/' >/dev/null 2>&1; then
            echo "Helm schema accepted an image repository ending in a path separator"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set-string 'gateway.image.repository=registry.example//relaygate' >/dev/null 2>&1; then
            echo "Helm schema accepted an image repository with an empty path segment"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set-string 'gateway.image.repository=ghcr.io/Team/relaygate-gateway' >/dev/null 2>&1; then
            echo "Helm schema accepted an uppercase image repository path"
            exit 1
          fi
          helm template image-registry-port deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set-string 'gateway.image.repository=registry.example:5000/team/relaygate' \
            >/dev/null
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set 'routeTable.extraEnv[0].name=POD_INDEX' \
            --set 'routeTable.extraEnv[0].value=0' >/dev/null 2>&1; then
            echo "Helm chart accepted an override of the RouteTable pod ordinal"
            exit 1
          fi
          for override in \
            'gateway.podAnnotations={"checksum/shard-directory":"override"}' \
            'gateway.podAnnotations={"prometheus.io/port":"override"}' \
            'routeTable.podAnnotations={"checksum/shard-directory":"override"}'
          do
            if helm template invalid deploy/helm/relaygate \
              --kube-version 1.32.0 \
              --set-json "$override" >/dev/null 2>&1; then
              echo "Helm chart accepted an override of a managed runtime annotation"
              exit 1
            fi
          done
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set gateway.sdkPort=27420 \
            --set gateway.peerPort=27420 >/dev/null 2>&1; then
            echo "Helm chart accepted colliding Gateway container ports"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set metrics.gatewayPort=27420 >/dev/null 2>&1; then
            echo "Helm chart accepted a Gateway metrics port colliding with the SDK port"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set metrics.routeTablePort=27430 >/dev/null 2>&1; then
            echo "Helm chart accepted a RouteTable metrics port colliding with its service port"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set gateway.service.type=LoadBalancer \
            --set-string gateway.service.loadBalancerClass=Invalid_Domain/class >/dev/null 2>&1; then
            echo "Helm schema accepted an invalid LoadBalancer class"
            exit 1
          fi
          load_balancer_class_too_long=$(printf 'a%.0s' {1..64})
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set gateway.service.type=LoadBalancer \
            --set-string "gateway.service.loadBalancerClass=${load_balancer_class_too_long}" >/dev/null 2>&1; then
            echo "Helm schema accepted a LoadBalancer class name longer than 63 characters"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set gateway.drainTimeoutMs=120000 \
            --set gateway.terminationGracePeriodSeconds=120 >/dev/null 2>&1; then
            echo "Helm chart accepted a termination grace period that cannot cover Gateway drain"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set authorization.existingConfigMap=invalid..name >/dev/null 2>&1; then
            echo "Helm schema accepted an invalid authorization ConfigMap reference"
            exit 1
          fi
          long_dns_label=$(printf 'a%.0s' {1..64})
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set "authorization.existingConfigMap=${long_dns_label}" >/dev/null 2>&1; then
            echo "Helm chart accepted an authorization ConfigMap reference with an oversized DNS label"
            exit 1
          fi
          if helm template invalid deploy/helm/relaygate \
            --kube-version 1.32.0 \
            --set "clusterDomain=${long_dns_label}.local" >/dev/null 2>&1; then
            echo "Helm chart accepted a cluster domain with an oversized DNS label"
            exit 1
          fi
          dns_label_a=$(printf 'a%.0s' {1..63})
          dns_label_b=$(printf 'b%.0s' {1..63})
          dns_label_c=$(printf 'c%.0s' {1..63})
          cluster_domain_prefix="${dns_label_a}.${dns_label_b}.${dns_label_c}"
          cluster_domain_at_limit="${cluster_domain_prefix}.dddd"
          cluster_domain_over_limit="${cluster_domain_prefix}.ddddd"
          gateway_hostname_at_limit="relaygate-gateway-2.relaygate-gateway-peer.relaygate.svc.${cluster_domain_at_limit}"
          test "${#gateway_hostname_at_limit}" -eq 253
          helm template relaygate deploy/helm/relaygate \
            --namespace relaygate \
            --kube-version 1.32.0 \
            --set "clusterDomain=${cluster_domain_at_limit}" >/dev/null
          if helm template relaygate deploy/helm/relaygate \
            --namespace relaygate \
            --kube-version 1.32.0 \
            --set "clusterDomain=${cluster_domain_over_limit}" >/dev/null 2>&1; then
            echo "Helm chart accepted a generated Gateway hostname longer than 253 characters"
            exit 1
          fi

          docker run --rm \
            --volume "$PWD:/workdir" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary \
            /workdir/target/helm/default.yaml \
            /workdir/target/helm/minimal.yaml \
            /workdir/target/helm/ambiguous-name.yaml
          helm package deploy/helm/relaygate --destination target/helm
          version=$(python3 .github/scripts/helm_release.py check-version)
          package="relaygate-${version}.tgz"
          digest=$(python3 .github/scripts/helm_release.py stage \
            "target/helm/$package" target/helm/repository)
          helm package deploy/helm/relaygate --destination target/helm/retry
          retry_digest=$(python3 .github/scripts/helm_release.py stage \
            "target/helm/retry/$package" target/helm/repository)
          test "$digest" = "$retry_digest"
          (cd target/helm/repository && sha256sum --check "$package.sha256")
          helm repo index target/helm/repository --url "$CHART_REPOSITORY"
          helm show chart "target/helm/repository/$package"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: scope
        # `shell: bash` enables pipefail, so a script failure fails this step
        # instead of leaving the outputs empty and silently skipping jobs.
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/change_scope.py --base "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Verify crate package archives
        if: steps.scope.outputs.published == 'true'
        run: .github/scripts/check-crate-packages.sh

      - name: Verify SDK observability isolation
        run: |
          for _ in {1..20}; do
            cargo test -p relaygate-sdk --lib --locked -- --test-threads=8
          done

      - name: Audit requirement-test traceability
        run: |
          mkdir -p target/contract
          cargo test --workspace --locked -- --list > target/contract/tests.txt
          cargo run -p relaygate-test-contract --locked -- gate \
            --matrix docs/test/001-requirement-test-matrix.md \
            --spec-dir docs/spec \
            --coverage docs/test/001-executable-coverage.toml \
            --test-list target/contract/tests.txt

  compose:
    name: Docker Compose RT2/GW3 E2E
    needs: [hygiene, rust]
    if: github.event_name != 'pull_request' || needs.hygiene.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image targets
        run: |
          docker build --file deploy/docker/Dockerfile --target gateway --tag relaygate-gateway:ci .
          docker build --file deploy/docker/Dockerfile --target route-table --tag relaygate-route-table:ci .
          for image in relaygate-gateway:ci relaygate-route-table:ci; do
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '10001:10001'
            test "$(docker image inspect --format '{{.Config.WorkingDir}}' "$image")" = '/'
          done

      - name: Start two RouteTables, three Gateways, Listeners, and continuity Pipes
        run: |
          docker compose up --build -d --wait \
            rt-0 rt-1 gateway-a gateway-b gateway-c \
            listener-a listener-b listener-c listener-shared-b listener-shared-c \
            listener-boundary-c continuity-ac continuity-a-zero

      - name: Verify all local and directed remote paths
        run: |
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe matrix
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Verify Prometheus targets and Grafana provisioning
        run: |
          docker compose --profile observability up -d --no-deps prometheus grafana
          docker compose --profile observability run --rm --no-deps observability-probe

      - name: Verify Grafana navigation and capture dashboards
        timeout-minutes: 5
        run: |
          # Real DIALs after scrape startup produce non-idle RED samples for visual review.
          for _ in {1..6}; do
            docker compose run --rm --no-deps topology-probe relaygate-echo-probe matrix
            sleep 2
          done
          mkdir -p "$RUNNER_TEMP/grafana-screenshots"
          docker run --rm --init --ipc=host --network host \
            --volume "$PWD:/work:ro" \
            --volume "$RUNNER_TEMP/grafana-screenshots:/captures" \
            --env GRAFANA_SCREENSHOTS=/captures \
            --env NODE_PATH=/tmp/browser/node_modules \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            /bin/sh -ec 'npm install --prefix /tmp/browser --no-save --package-lock=false playwright@1.63.0; node /work/.github/scripts/grafana_ui.cjs'

      - name: Upload Grafana screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relaygate-grafana
          path: ${{ runner.temp }}/grafana-screenshots
          if-no-files-found: ignore

      - name: Verify unrelated pair continuity across Gateway B restart
        run: |
          prometheus_has() {
            expression="$1"
            for _ in {1..30}; do
              if curl -fsSG --data-urlencode "query=${expression}" \
                http://127.0.0.1:29090/api/v1/query |
                jq -e '.data.result | length > 0' >/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "Prometheus expression did not converge: ${expression}" >&2
            return 1
          }

          docker compose restart gateway-b
          docker compose up -d --wait --no-deps gateway-b
          prometheus_has 'sum(relaygate_gateway_peer_transport_closed_total) > 0'
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-destination examples/echo-b
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe matrix

      - name: Measure established Pipe DATA RTT
        run: |
          docker compose run --rm --no-deps \
            -e RELAYGATE_LATENCY_WARMUP=100 \
            -e RELAYGATE_LATENCY_SAMPLES=1000 \
            topology-probe relaygate-echo-probe latency | tee latency.log
          python3 .github/scripts/test_observability.py --probe latency.log

      - name: Upload DATA RTT measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relaygate-data-rtt
          path: latency.log
          if-no-files-found: ignore

      - name: Verify rt-0 failure isolation and established Pipe continuity
        run: |
          docker compose stop rt-0
          docker compose run --rm --no-deps topology-probe \
            relaygate-echo-probe expect-shard-isolation examples/echo-a 0 examples/echo-b
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Verify rt-0 current-state recovery
        run: |
          docker compose up -d rt-0
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-destination examples/echo-a
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-destination examples/echo-shared
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-destination examples/echo-boundary
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe matrix
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Verify rt-1 failure isolation and established Pipe continuity
        run: |
          docker compose stop rt-1
          docker compose run --rm --no-deps topology-probe \
            relaygate-echo-probe expect-shard-isolation examples/echo-b 1 examples/echo-a
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Verify rt-1 current-state recovery
        run: |
          docker compose up -d rt-1
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-destination examples/echo-b
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe wait-destination examples/echo-c
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe matrix
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Verify dashboard fault signals and recovery
        run: |
          prometheus_has() {
            expression="$1"
            for _ in {1..30}; do
              if curl -fsSG --data-urlencode "query=${expression}" \
                http://127.0.0.1:29090/api/v1/query |
                jq -e '.data.result | length > 0' >/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "Prometheus expression did not converge: ${expression}" >&2
            return 1
          }

          docker compose stop rt-0
          prometheus_has 'sum(up{job="relaygate-route-table"} == 1) == 1'
          prometheus_has 'sum(relaygate_gateway_route_dependency{state="READY"}) < 3'
          prometheus_has 'sum(relaygate_gateway_route_registrations_unsynced) > 0'
          prometheus_has 'sum(relaygate_gateway_route_dependency_transitions_total{current="degraded"}) > 0'

          docker compose up -d rt-0
          docker compose run --rm --no-deps topology-probe relaygate-echo-probe matrix
          docker compose --profile observability run --rm --no-deps observability-probe
          prometheus_has 'sum(relaygate_gateway_route_dependency{state="READY"}) == 3'
          prometheus_has 'sum(relaygate_gateway_route_registrations_unsynced) == 0'
          prometheus_has 'sum(relaygate_gateway_route_dependency_transitions_total{previous="degraded",current="ready"}) > 0'

      - name: Verify bounded overload preserves established Pipes
        run: |
          set -o pipefail

          prometheus_has() {
            expression="$1"
            for _ in {1..30}; do
              if curl -fsSG --data-urlencode "query=${expression}" \
                http://127.0.0.1:29090/api/v1/query |
                jq -e '.data.result | length > 0' >/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "Prometheus expression did not converge: ${expression}" >&2
            return 1
          }

          docker compose run --rm --no-deps \
            -e RELAYGATE_ADDR=gateway-a:27420 \
            -e RELAYGATE_DESTINATION=examples/echo-b \
            -e RELAYGATE_OVERLOAD_DURATION_SECS=3 \
            -e RELAYGATE_OVERLOAD_WORKERS=256 \
            -e RELAYGATE_OVERLOAD_SESSIONS=1 \
            topology-probe relaygate-echo-probe overload | tee overload.log
          grep -Eq 'resource_exhausted_not_observed=[1-9][0-9]*' overload.log
          prometheus_has 'sum(relaygate_gateway_control_rejections_total{operation="dial",scope="session"}) > 0'
          prometheus_has '(sum(relaygate_gateway_writer_queue_rejections_total) or vector(0)) == 0'
          docker compose exec -T continuity-ac relaygate-echo-probe continuity-check
          docker compose exec -T continuity-a-zero relaygate-echo-probe continuity-check

      - name: Verify logical cleanup baseline
        run: |
          docker compose stop \
            listener-a listener-b listener-c listener-shared-b listener-shared-c \
            listener-boundary-c continuity-ac continuity-a-zero
          for metric in \
            relaygate_gateway_sessions relaygate_gateway_bindings \
            relaygate_gateway_pending_offers relaygate_gateway_live_pipes \
            relaygate_gateway_originated_pipes relaygate_gateway_remote_dial_attempts \
            relaygate_gateway_peer_streams relaygate_route_table_bindings; do
            matched=false
            for _ in {1..60}; do
              if curl -fsSG --data-urlencode "query=sum($metric{cluster=\"compose\",namespace=\"relaygate\"}) == 0" \
                http://127.0.0.1:29090/api/v1/query | jq -e '.data.result | length > 0' >/dev/null; then
                matched=true
                break
              fi
              sleep 1
            done
            test "$matched" = true || { echo "Cleanup did not converge: $metric"; exit 1; }
          done

      - name: Capture logs
        if: failure()
        run: docker compose --profile observability logs --no-color > compose.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relaygate-compose-logs
          path: compose.log

      - name: Tear down
        if: always()
        run: docker compose --profile observability down --volumes --remove-orphans
