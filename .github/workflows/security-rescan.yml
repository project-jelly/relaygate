name: Released image security

on:
  schedule:
    - cron: '23 18 * * *' # Daily at 03:23 KST (UTC+9).
  workflow_dispatch:

concurrency:
  group: released-image-security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve latest image digests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Resolve both platforms from each latest image index
        id: images
        shell: bash
        run: |
          set -euo pipefail
          targets="$RUNNER_TEMP/trivy-targets.jsonl"
          : > "$targets"
          for component in gateway route-table; do
            image="ghcr.io/project-jelly/relaygate-${component}"
            manifest=$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}')
            index_digest=$(jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))' <<< "$manifest")
            resolved_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            for architecture in amd64 arm64; do
              digest=$(jq -er --arg architecture "$architecture" '
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest]
                | if length == 1 then .[0] else error("expected exactly one platform manifest") end
                | select(test("^sha256:[a-f0-9]{64}$"))
              ' <<< "$manifest")
              jq -cn --arg component "$component" --arg architecture "$architecture" \
                --arg image "$image" --arg index_digest "$index_digest" \
                --arg digest "$digest" --arg resolved_at "$resolved_at" \
                '$ARGS.named' >> "$targets"
            done
          done
          echo "matrix=$(jq -sc '{include: .}' "$targets")" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.component }} / ${{ matrix.architecture }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan released platform digest
        uses: ./.github/actions/image-security
        with:
          image: ${{ matrix.image }}
          digest: ${{ matrix.digest }}
          architecture: ${{ matrix.architecture }}
          artifact: trivy-latest-${{ matrix.component }}-${{ matrix.architecture }}
