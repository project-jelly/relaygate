name: Release crates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace crate version to publish
        required: true
        type: string
      confirmation:
        description: Type publish-<version>
        required: true
        type: string

concurrency:
  group: release-crates-io
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: 1.96.1

jobs:
  publish:
    name: Publish crates.io packages
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release request
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          current_sha=$(git rev-parse "origin/${DEFAULT_BRANCH}")
          if [ "$GITHUB_SHA" != "$current_sha" ]; then
            echo "::error::run this workflow from the current ${DEFAULT_BRANCH} branch"
            exit 1
          fi

          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$REQUESTED_VERSION" != "$version" ]; then
            echo "::error::requested version ${REQUESTED_VERSION} does not match workspace version ${version}"
            exit 1
          fi
          if [ "$CONFIRMATION" != "publish-${version}" ]; then
            echo "::error::confirmation must be publish-${version}"
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Verify package archives
        run: .github/scripts/check-crate-packages.sh

      - name: Publish missing crates after verifying existing versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 .github/scripts/release_crates.py --publish
