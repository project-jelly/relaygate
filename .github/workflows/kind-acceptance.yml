name: Peer Tail Hosted Check (temporary branch only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peer-tail-hosted-check
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  experiment:
    if: github.ref == 'refs/heads/codex/peer-tail-hosted-check' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate experiment helpers
        run: python3 -m unittest discover -s .github/scripts -p test_peer_tail_hosted.py -v
      - name: Build exact sources and run one fixed experiment
        run: python3 .github/scripts/peer_tail_hosted.py run
      - name: Clean only this experiment's resources
        if: always()
        run: python3 .github/scripts/peer_tail_hosted.py cleanup
      - name: Upload all experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peer-tail-hosted-${{ github.run_id }}
          path: target/peer-tail-hosted
          if-no-files-found: error
          retention-days: 30
