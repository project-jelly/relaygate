[workspace]
resolver = "3"
members = [
    "crates/relaygate-destination",
    "crates/relaygate-gateway",
    "crates/relaygate-gateway-peer",
    "crates/relaygate-gateway-routing",
    "crates/relaygate-protocol",
    "crates/relaygate-route-table",
    "crates/relaygate-route-table-transport",
    "crates/relaygate-sdk",
    "crates/relaygate-server",
    "crates/relaygate-token-issuer",
    "crates/relaygate-transport",
    "examples/echo-listener",
    "examples/echo-probe",
    "tools/test-contract",
]

[workspace.package]
version = "0.5.5"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
license-file = "LICENSE"
repository = "https://github.com/project-jelly/relaygate"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
metrics = "0.24.6"
metrics-util = "0.20.4"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
relaygate-destination = { version = "0.5.5", path = "crates/relaygate-destination" }
relaygate-gateway = { path = "crates/relaygate-gateway" }
relaygate-gateway-peer = { path = "crates/relaygate-gateway-peer" }
relaygate-gateway-routing = { path = "crates/relaygate-gateway-routing" }
relaygate-protocol = { version = "0.5.5", path = "crates/relaygate-protocol" }
relaygate-route-table = { path = "crates/relaygate-route-table" }
relaygate-route-table-transport = { path = "crates/relaygate-route-table-transport" }
relaygate-sdk = { version = "0.5.5", path = "crates/relaygate-sdk" }
relaygate-token-issuer = { version = "0.5.5", path = "crates/relaygate-token-issuer" }
relaygate-transport = { version = "0.5.5", path = "crates/relaygate-transport" }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1.0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unreachable = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
