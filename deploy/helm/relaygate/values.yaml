clusterDomain: cluster.local

imagePullSecrets: []

authorization:
  # Namespace별 trusted issuer와 ES256 public JWK만 포함한다.
  existingConfigMap: relaygate-authorization
  configKey: authorization.json

tls:
  # SDK edge와 internal mTLS는 별도 trust domain이며 platform이 Issuer/CA를 소유한다.
  edge:
    existingSecret: relaygate-edge-tls
    # customCa는 ca.crt를 mount하고, webPkiRoots는 공개 root set을 사용한다.
    trustMode: customCa
    serverName: relaygate-gateway.internal
  internal:
    mode: mtls
    trustSecret: relaygate-internal-trust
    gatewaySecret: relaygate-gw-internal-tls
    routeTableSecret: relaygate-rt-internal-tls
    gatewayServerName: relaygate-gateway.internal
    routeTableServerName: relaygate-route-table.internal

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

metrics:
  # Cluster-internal low-cardinality Prometheus endpoint.
  enabled: true
  intervalMs: 5000
  gatewayPort: 27422
  routeTablePort: 27431

gateway:
  annotations: {}
  replicaCount: 1

  image:
    repository: ghcr.io/project-jelly/relaygate-gateway
    tag: "0.5.6"
    pullPolicy: IfNotPresent

  sdkPort: 27420
  peerPort: 27421

  service:
    type: ClusterIP
    port: 27420
    annotations: {}
    loadBalancerClass: ""
    externalTrafficPolicy: Cluster

  log: info
  logFormat: json
  statsIntervalMs: null

  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  drainTimeoutMs: 120000
  terminationGracePeriodSeconds: 135

  # Chart-managed 값 이외의 capacity/timeout override.
  extraEnv: []

routeTable:
  annotations: {}
  # StatefulSet ordinal별 logical shard 수. 허용 범위 1..2048.
  shardCount: 1

  image:
    repository: ghcr.io/project-jelly/relaygate-route-table
    tag: "0.5.6"
    pullPolicy: IfNotPresent

  port: 27430
  leaseTtlMs: 30000
  log: info
  logFormat: json

  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  terminationGracePeriodSeconds: 30

  # Chart-managed 값 이외의 queue/frame/handshake override.
  extraEnv: []
